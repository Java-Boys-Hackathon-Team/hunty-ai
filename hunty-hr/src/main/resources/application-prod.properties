main.datasource.url=${PG_DATASOURCE_URL}
main.datasource.username=${PG_NAME}
main.datasource.password=${PG_PASS}

jmix.awsfs.endpoint-url = ${MINIO_ENDPOINT_URL:http://hunty-hr-s3:9000}

jmix.rest.anonymous-url-patterns=\/rest/entities/AccessRequest
jmix.ui.allow-anonymous-access=true


# Хранилище файлов - общий MinIO, параметры приходят из окружения.
jmix.awsfs.access-key = ${MINIO_ACCESS_KEY:minioadmin}
jmix.awsfs.secret-access-key = ${MINIO_SECRET_KEY:minioadmin}
jmix.awsfs.bucket = ${MINIO_BUCKET:public}

# С токеном-заглушкой бот бесконечно получает отказ и забивает журнал, поэтому
# на сервере он выключен переменной окружения (TELEGRAM_BOT_ENABLED=false в
# .env.prod). Локально поведение прежнее - бот включён.
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}

# Приложение стоит за обратным прокси, который терминирует TLS: без этого
# редиректы уводят с https на http.
server.forward-headers-strategy=framework
